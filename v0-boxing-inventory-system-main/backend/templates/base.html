<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Boxing Store - Menaxhimi i Stokut{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #0a0a0a;
            color: #fafafa;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        
        /* Header */
        header {
            background-color: #171717;
            border-bottom: 1px solid #262626;
            padding: 1.5rem 0;
        }
        
        .header-content {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .logo-icon {
            background-color: #3b82f6;
            padding: 0.5rem;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-icon svg {
            width: 2rem;
            height: 2rem;
            color: white;
        }
        
        .header-text h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .header-text p {
            color: #a3a3a3;
            font-size: 0.875rem;
        }
        
        /* Main */
        main {
            padding: 2rem 0;
        }
        
        /* Flash Messages */
        .flash-messages {
            margin-bottom: 1rem;
        }
        
        .flash {
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
        }
        
        .flash.success {
            background-color: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        
        .flash.error {
            background-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        
        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        @media (min-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        
        .stat-card {
            background-color: #171717;
            border: 1px solid #262626;
            border-radius: 0.5rem;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .stat-icon {
            padding: 0.5rem;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .stat-icon.primary {
            background-color: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }
        
        .stat-icon.warning {
            background-color: rgba(234, 179, 8, 0.2);
            color: #eab308;
        }
        
        .stat-icon svg {
            width: 1.25rem;
            height: 1.25rem;
        }
        
        .stat-label {
            color: #a3a3a3;
            font-size: 0.875rem;
        }
        
        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
        }
        
        /* Search and Filters */
        .filters {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        @media (min-width: 640px) {
            .filters {
                flex-direction: row;
            }
        }
        
        .search-input {
            flex: 1;
            padding: 0.625rem 1rem;
            background-color: #171717;
            border: 1px solid #262626;
            border-radius: 0.5rem;
            color: #fafafa;
            font-size: 1rem;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        
        .search-input::placeholder {
            color: #737373;
        }
        
        select {
            padding: 0.625rem 1rem;
            background-color: #171717;
            border: 1px solid #262626;
            border-radius: 0.5rem;
            color: #fafafa;
            font-size: 1rem;
            cursor: pointer;
        }
        
        select:focus {
            outline: none;
            border-color: #3b82f6;
        }
        
        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            border: none;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background-color: #3b82f6;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #2563eb;
        }
        
        .btn-secondary {
            background-color: #262626;
            color: #fafafa;
        }
        
        .btn-secondary:hover {
            background-color: #404040;
        }
        
        .btn-danger {
            background-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        
        .btn-danger:hover {
            background-color: rgba(239, 68, 68, 0.3);
        }
        
        .btn-icon {
            padding: 0.375rem;
            border-radius: 0.375rem;
            background: transparent;
            border: none;
            cursor: pointer;
            color: #a3a3a3;
            transition: all 0.2s;
        }
        
        .btn-icon:hover {
            background-color: #262626;
        }
        
        .btn-icon.danger:hover {
            background-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        
        .btn-icon:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-icon svg {
            width: 1rem;
            height: 1rem;
        }
        
        /* Table */
        .table-container {
            background-color: #171717;
            border: 1px solid #262626;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        
        .table-scroll {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            background-color: #262626;
        }
        
        th {
            text-align: left;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            font-weight: 600;
        }
        
        td {
            padding: 0.75rem 1rem;
            border-top: 1px solid #262626;
        }
        
        tbody tr:hover {
            background-color: rgba(38, 38, 38, 0.5);
        }
        
        /* Product Image */
        .product-image {
            width: 3rem;
            height: 3rem;
            border-radius: 0.5rem;
            background-color: #262626;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .product-image svg {
            width: 1.25rem;
            height: 1.25rem;
            color: #737373;
        }
        
        /* Badge */
        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 500;
        }
        
        .badge-category {
            background-color: #262626;
            color: #fafafa;
        }
        
        .badge-stock {
            font-weight: 600;
        }
        
        .badge-stock.success {
            background-color: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }
        
        .badge-stock.warning {
            background-color: rgba(234, 179, 8, 0.2);
            color: #eab308;
        }
        
        .badge-stock.danger {
            background-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        
        /* Product Name */
        .product-name {
            font-weight: 500;
        }
        
        .product-color {
            color: #a3a3a3;
            font-size: 0.875rem;
        }
        
        /* Actions */
        .actions {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        
        /* Form */
        .form-container {
            background-color: #171717;
            border: 1px solid #262626;
            border-radius: 0.5rem;
            max-width: 32rem;
            margin: 0 auto;
        }
        
        .form-header {
            padding: 1rem;
            border-bottom: 1px solid #262626;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .form-header h2 {
            font-size: 1.125rem;
            font-weight: 600;
        }
        
        .form-body {
            padding: 1rem;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.25rem;
            font-size: 0.875rem;
            font-weight: 500;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.5rem 0.75rem;
            background-color: #0a0a0a;
            border: 1px solid #262626;
            border-radius: 0.5rem;
            color: #fafafa;
            font-size: 1rem;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        
        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        
        .form-row-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }
        
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            padding-top: 1rem;
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #737373;
        }
        
        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 2rem;
            color: #737373;
        }
        
        /* Responsive */
        @media (max-width: 640px) {
            .form-row,
            .form-row-3 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                    </svg>
                </div>
                <div class="header-text">
                    <h1>Boxing Store</h1>
                    <p>Menaxhimi i Stokut</p>
                </div>
            </div>
        </div>
    </header>
    
    <main>
        <div class="container">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-messages">
                        {% for category, message in messages %}
                            <div class="flash {{ category }}">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}
            
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
